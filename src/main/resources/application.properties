spring.application.name=smartfarm-mng-app
server.port= 8001
spring.datasource.url=jdbc:mysql://localhost:3306/smartfarm_db
spring.datasource.username=root
spring.datasource.password=tenacioust!

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql=true
logging.level.org.hibernate.SQL=debug

# Resend HTTP Email API (Bypasses SMTP port restrictions on Render / Cloud)
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:AgroSync <onboarding@resend.dev>} 
 
# Optional SMTP Fallback Configuration
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:465}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=${SPRING_MAIL_PORT:${MAIL_PORT:465}}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000